name: h.coffee Intel macOS build

on:
  push:
    branches: [h-coffee-intel-build]
  workflow_dispatch:

jobs:
  mac-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r src/requirements.txt
      - name: Build Intel app
        env:
          REQUIRE_CLEAN_SOURCE: '1'
        run: bash .ci/build-hcoffee-mac-intel.sh
      - uses: actions/upload-artifact@v4
        with:
          name: artisan-hcoffee-mac-intel-test
          path: dist-hcoffee/Artisan-hcoffee-mac-intel-test.zip
          if-no-files-found: error
          retention-days: 1
